<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cip File Email — File this email</title>

<!-- Office.js (for messageParent communication with commands.js) -->
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<!-- Self-hosted MSAL (matches the taskpane to share the same session cache) -->
<script src="msal-browser.min.js"></script>
<!-- Shared add-in config (clientId / tenantId / scopes) -->
<script src="config.js"></script>

<style>
  :root {
    --navy-deep:#0B2E47; --navy:#0F3D5C; --blue-mid:#1A6A9E; --blue-accent:#39A3DC;
    --blue-pale:#E8F1F7; --text:#2C3E50; --text-muted:#5A6B7A; --rule:#C9DCE8;
    --white:#FFFFFF; --green:#2E9E5B; --amber:#D98F30; --red:#C13C3C; --bg:#F4F6F8;
  }
  *{box-sizing:border-box;}
  body{margin:0;padding:14px 16px;font-family:'Segoe UI',Tahoma,sans-serif;font-size:13px;
       color:var(--text);background:var(--bg);min-height:100vh;}
  .head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
  .h1{font-size:15px;font-weight:700;color:var(--navy-deep);line-height:1.3;}
  .sub{font-size:11px;color:var(--text-muted);margin-top:2px;}
  .pixel-logo{display:flex;gap:1px;}
  .pixel-logo span{width:5px;height:5px;background:var(--blue-accent);border-radius:1px;}
  .pixel-logo span.empty{background:transparent;}

  .field{display:flex;flex-direction:column;gap:3px;margin-bottom:9px;}
  .field label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.8px;color:var(--navy);font-weight:600;}
  .picker{background:white;border:1px solid var(--rule);border-radius:5px;padding:7px 9px;
          cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;}
  .picker:hover{border-color:var(--blue-mid);}
  .picker.empty{color:var(--text-muted);font-style:italic;}
  .picker .arrow{color:var(--blue-mid);font-size:10px;}
  .picker-list{display:none;background:white;border:1px solid var(--blue-accent);border-radius:5px;
               margin-top:3px;max-height:180px;overflow-y:auto;box-shadow:0 4px 10px rgba(15,61,92,0.08);}
  .picker-list.show{display:block;}
  .picker-list .search{padding:6px 8px;border-bottom:1px solid var(--rule);}
  .picker-list input{width:100%;padding:5px 7px;border:1px solid var(--rule);border-radius:4px;font-size:12px;}
  .picker-list .item{padding:6px 9px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--rule);}
  .picker-list .item:last-child{border-bottom:none;}
  .picker-list .item:hover{background:var(--blue-pale);}
  .picker-list .item .label{font-weight:600;color:var(--navy);}
  .picker-list .item .url{font-size:10.5px;color:var(--text-muted);margin-top:1px;
                          white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .picker-list .empty{padding:8px 9px;color:var(--text-muted);font-style:italic;font-size:11.5px;}

  input[type=text], textarea, select{
    background:white;border:1px solid var(--rule);border-radius:5px;padding:6px 9px;
    font-family:inherit;font-size:12.5px;color:var(--text);width:100%;
  }
  input[type=text]:focus, textarea:focus, select:focus{outline:none;border-color:var(--blue-accent);
    box-shadow:0 0 0 2px rgba(57,163,220,0.15);}
  textarea{resize:vertical;min-height:38px;}
  .row{display:flex;gap:8px;}
  .row .field{flex:1;}

  .actions{display:flex;gap:6px;justify-content:flex-end;margin-top:14px;
           padding-top:10px;border-top:1px solid var(--rule);}
  .btn{padding:7px 13px;border-radius:5px;border:none;font-family:inherit;font-size:12.5px;
       font-weight:600;cursor:pointer;}
  .btn.primary{background:linear-gradient(135deg,var(--navy),var(--blue-mid));color:white;}
  .btn.primary:hover{background:linear-gradient(135deg,var(--blue-mid),var(--blue-accent));}
  .btn.primary:disabled{background:var(--text-muted);cursor:not-allowed;opacity:0.6;}
  .btn.ghost{background:white;border:1px solid var(--rule);color:var(--text);}
  .btn.ghost:hover{border-color:var(--blue-mid);color:var(--navy);}
  .btn.danger{background:white;border:1px solid var(--rule);color:var(--red);}
  .btn.danger:hover{border-color:var(--red);}

  .banner{padding:8px 10px;border-radius:5px;font-size:11.5px;margin-bottom:10px;display:none;}
  .banner.warn{background:#fff7e6;border:1px solid #f0c779;color:#80541a;display:block;}
  .banner.error{background:#fdeaea;border:1px solid #f0aaaa;color:var(--red);display:block;}
  .banner.info{background:var(--blue-pale);border:1px solid var(--blue-accent);color:var(--navy);display:block;}

  .signin-prompt{text-align:center;padding:20px 12px;color:var(--text-muted);font-size:12.5px;line-height:1.5;}
  .signin-prompt strong{color:var(--navy-deep);display:block;margin-bottom:6px;font-size:13px;}
</style>
</head>
<body>

<div class="head">
  <div>
    <div class="h1">File this email</div>
    <div class="sub" id="sub">Pick where this email will be filed after sending.</div>
  </div>
  <div class="pixel-logo">
    <span></span><span class="empty"></span><span></span>
    <span></span><span></span><span class="empty"></span>
  </div>
</div>

<div class="banner" id="banner"></div>

<!-- Form (hidden until auth + sites loaded) -->
<div id="form-area" style="display:none;">

  <div class="field">
    <label>SharePoint site</label>
    <div class="picker empty" id="site-picker" onclick="togglePicker('site')">
      <span id="site-label">Loading sites…</span>
      <span class="arrow">▾</span>
    </div>
    <div class="picker-list" id="site-list">
      <div class="search"><input type="text" id="site-search" placeholder="Search sites…" oninput="filterSites()"/></div>
      <div id="site-items"><div class="empty">Loading…</div></div>
    </div>
  </div>

  <div class="field">
    <label>Document library</label>
    <div class="picker empty" id="lib-picker" onclick="togglePicker('lib')">
      <span id="lib-label">Pick a site first</span>
      <span class="arrow">▾</span>
    </div>
    <div class="picker-list" id="lib-list">
      <div id="lib-items"><div class="empty">Pick a site to see libraries</div></div>
    </div>
  </div>

  <div class="field">
    <label>Subfolder (optional)</label>
    <input type="text" id="f-folder" placeholder="e.g. 2026/Tickets/INC-12345"/>
  </div>

  <div class="row">
    <div class="field">
      <label>Client</label>
      <input type="text" id="f-client" placeholder="Client name"/>
    </div>
    <div class="field">
      <label>Project / Ticket</label>
      <input type="text" id="f-project" placeholder="INC-12345"/>
    </div>
  </div>

  <div class="field">
    <label>Category</label>
    <select id="f-category">
      <option value="">— Select —</option>
      <option>Client communication</option>
      <option>Internal</option>
      <option>Vendor</option>
      <option>Incident</option>
      <option>Project</option>
      <option>Contract</option>
      <option>Other</option>
    </select>
  </div>

  <div class="field">
    <label>Notes (optional)</label>
    <textarea id="f-notes" rows="2" placeholder="Why filed, what to remember…"></textarea>
  </div>

</div>

<!-- Shown if MSAL can't get a silent token (user hasn't signed in via the taskpane yet) -->
<div id="signin-area" class="signin-prompt" style="display:none;">
  <strong>Please sign in first</strong>
  Open the cip File Email taskpane on any received message and sign in once.
  Then come back and try sending again.
</div>

<!-- Action buttons - always visible -->
<div class="actions">
  <button class="btn danger"  id="btn-cancel" onclick="onAction('cancel')">Cancel send</button>
  <button class="btn ghost"   id="btn-skip"   onclick="onAction('skip')">Send without filing</button>
  <button class="btn primary" id="btn-file"   onclick="onAction('file')" disabled>File and send</button>
</div>

<script src="dialog.js"></script>
</body>
</html>
